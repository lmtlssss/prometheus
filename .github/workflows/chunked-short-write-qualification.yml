name: Chunked remote write integrity qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-chunked-writer-short-frames-20261025
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check source formatting
        run: test -z "$(gofmt -l storage/remote/chunked.go storage/remote/chunked_short_write_test.go)"
      - name: Run targeted framing tests
        run: go test -count=1 -run 'TestChunkedWriterRejectsShortFrameWrites|TestChunkedWriterFullFrameStillRoundTrips|TestChunkedReader' ./storage/remote
